name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Decode and install certificate
        run: |
          # Decode base64 secrets (strip any whitespace/newlines)
          echo "${{ secrets.CERTIFICATE_P12 }}" | tr -d '\n' | base64 --decode > /tmp/cert.p12
          echo "${{ secrets.PROVISIONING_PROFILE }}" | tr -d '\n' | base64 --decode > /tmp/profile.mobileprovision
          
          # Verify files
          ls -la /tmp/cert.p12 /tmp/profile.mobileprovision
          openssl pkcs12 -in /tmp/cert.p12 -noout -passin pass:${{ secrets.CERTIFICATE_PASSWORD }} && echo "p12 password OK"
          
          # Create keychain
          security create-keychain -p buildpassword build.keychain-db
          security default-keychain -s build.keychain-db
          security unlock-keychain -p buildpassword build.keychain-db
          security set-keychain-settings -t 3600 -u build.keychain-db
          
          # Import certificate with -legacy flag for compatibility
          security import /tmp/cert.p12 -k build.keychain-db -P "${{ secrets.CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign -legacy
          
          # Set key partition list
          security set-key-partition-list -S apple-tool:,apple: -s -k buildpassword build.keychain-db
          
          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "Certificate and profile installed"

      - name: Generate Xcode project
        run: cd TOTPAuthenticator && xcodegen generate

      - name: Show project structure
        run: ls -la TOTPAuthenticator/ && find TOTPAuthenticator -name "*.swift" | head -20

      - name: Build archive
        run: |
          cd TOTPAuthenticator
          xcodebuild archive \
            -project TOTPAuthenticator.xcodeproj \
            -scheme TOTPAuthenticator \
            -configuration Release \
            -archivePath build/TOTPAuthenticator.xcarchive \
            DEVELOPMENT_TEAM=2TAD594A66 \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="00008020-000A39E42603802E87" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=NO \
            -allowProvisioningUpdates

      - name: Export IPA
        run: |
          cd TOTPAuthenticator
          
          cat > /tmp/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>2TAD594A66</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.cert.account.t260901214911</key>
              <string>00008020-000A39E42603802E87</string>
            </dict>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath build/TOTPAuthenticator.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath build/ipa/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TOTPAuthenticator-IPA
          path: TOTPAuthenticator/build/ipa/*.ipa
          retention-days: 30
