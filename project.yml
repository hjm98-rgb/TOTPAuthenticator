name: TOTPAuthenticator
options:
  bundleIdPrefix: com.cert.account
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.cert.account.t260901214911
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: 2TAD594A66
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Distribution"
    PRODUCT_NAME: TOTPAuthenticator
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    INFOPLIST_KEY_NSCameraUsageDescription: "需要相机权限以扫描二维码添加账号"
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "需要相册权限以识别二维码图片"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    ENABLE_PREVIEWS: YES
targets:
  TOTPAuthenticator:
    type: application
    platform: iOS
    sources:
      - path: TOTPAuthenticator
    settings:
      base:
        INFOPLIST_FILE: TOTPAuthenticator/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  TOTPAuthenticator:
    build:
      targets:
        TOTPAuthenticator: all
    test:
      targets:
        - TOTPAuthenticator
